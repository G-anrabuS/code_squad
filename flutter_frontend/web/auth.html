<!doctype html>
<html>
    <head>
        <title>Authentication Callback</title>
        <script>
            window.onload = function () {
                var currentUrl = window.location.href;

                if (window.opener) {
                    // Try the normal way
                    window.opener.postMessage(
                        {
                            "flutter-web-auth-2":
                                currentUrl,
                        },
                        "*",
                    );
                } else {
                    // THE FIX: Drop the URL into LocalStorage
                    // The main Flutter app will be listening for this!
                    localStorage.setItem(
                        "flutter-web-auth-2-fallback",
                        currentUrl,
                    );
                }

                document.body.innerHTML =
                    "<h3>Success!</h3><p>Returning to app...</p>";

                setTimeout(function () {
                    window.close();
                }, 500);
            };
        </script>
    </head>
    <body>
        <h3>Authenticating...</h3>
        <p>Please wait.</p>
    </body>
</html>
