<head>
  <base href="$FLUTTER_BASE_HREF">
  <title>flutter_frontend</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.addEventListener('storage', function(e) {
      // If the popup dropped the auth URL into storage...
      if (e.key === 'flutter-web-auth-2-fallback' && e.newValue) {

        // Pass it to the Flutter plugin pretending we are the popup
        window.postMessage({
          'flutter-web-auth-2': e.newValue
        }, window.location.origin);

        // Clean up the memory
        localStorage.removeItem('flutter-web-auth-2-fallback');
      }
    });
  </script>

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
