name: flutter_frontend
description: "Code Squad - AI-powered GitHub code analysis platform"
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.12.0

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    dio: ^5.9.2
    flutter_web_auth_2: ^5.0.2
    shared_preferences: ^2.5.3

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4

flutter:
    uses-material-design: true

    assets:
        - assets/logo.png

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/logo.png"
    adaptive_icon_background: "#121212"
    adaptive_icon_foreground: "assets/logo.png"
